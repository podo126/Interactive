<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KY restaurant2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #111; background: #fff; line-height: 1.6;
  }
  .topbar { height: 12px; background: #aee4bd; }
  .wrap { width: min(92%, 1200px); margin: 0 auto; padding: 32px 0 80px; }
  .back {
    display: inline-block; margin-bottom: 32px;
    color: #4049b8; font-weight: 600; text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .back:hover { text-decoration: underline; opacity: 0.8; }
  h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; }
  .desc { font-size: 1.15rem; color: #2a2a2a; margin-bottom: 48px; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  @media (max-width: 768px) {
    .cards-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  }
  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; gap: 12px; }
  }

  .card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.3s ease,
                box-shadow 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(174, 228, 189, 0.1), rgba(155, 212, 168, 0.05));
    opacity: 0;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    border-color: #4049b8;
    box-shadow: 0 12px 24px rgba(64, 73, 184, 0.15);
    transform: translateY(-6px) scale(1.01);
  }
  .card:active { transform: translateY(-3px) scale(0.99); }
  .card:focus-visible { outline: 3px solid #4049b8; outline-offset: 2px; }

  .card-icon {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: linear-gradient(135deg, #aee4bd, #9bd4a8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
    box-shadow: 0 2px 8px rgba(155, 212, 168, 0.2);
  }
  .card:hover .card-icon {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 4px 12px rgba(155, 212, 168, 0.4);
  }

  .card-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #111;
  }
  .card-desc {
    font-size: 0.95rem;
    color: #666;
    line-height: 1.5;
    flex-grow: 1;
    margin-bottom: 12px;
  }
  .card-status { font-size: 0.85rem; color: #aaa; font-weight: 500; }
  .card-status.ready { color: #4049b8; font-weight: 600; }

  .embed {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 2px dashed #c4c3dc;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: #9a99b8;
    text-align: center;
    overflow: hidden;
    animation: fadeIn 0.4s ease-out;
  }
  .embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .embed.filled { border: none; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 640px) { .embed { aspect-ratio: 3 / 4; } }
  a:focus-visible { outline: 3px solid #4049b8; outline-offset: 3px; }
  .detail-view { animation: fadeIn 0.4s ease-out; }
  .detail-view .back { margin-bottom: 32px; }
  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="topbar"></div>
  <main class="wrap">
    <div id="list-view">
      <h1 id="main-title"></h1>
      <p class="desc" id="main-desc"></p>
      <div class="cards-grid" id="cards-container"></div>
    </div>
    <div id="detail-view" class="detail-view hidden">
      <a class="back" id="back" href="#">← 돌아가기</a>
      <h1 id="title"></h1>
      <p class="desc" id="desc"></p>
      <div class="embed" id="embed"></div>
    </div>
  </main>
<script>
  const HOME = "https://podo126.github.io/Interactive.github.io/";
  const PAGES = {
    "minigame": { title: "미니게임", desc: "간단하게 즐길 수 있는 다양한 미니게임들로 당신의 시간을 채워보세요.", file: "", icon: "🎮" },
    "3d-model": { title: "3D 모델", desc: "현실감 넘치는 3D 모델들을 직접 돌려보고 확대하며 탐험해보세요.", file: "", icon: "🎯" },
    "psych-test": { title: "심리테스트", desc: "흥미로운 질문들로 당신의 성향과 숨겨진 모습을 알아보세요.", file: "", icon: "🧠" },
    "virtual-tour": { title: "가상 투어", desc: "세계 곳곳의 명소를 집에서 편안하게 탐험하는 가상 경험을 즐겨보세요.", file: "", icon: "🌍" },
    "story": { title: "대화형 스토리", desc: "당신의 선택이 이야기를 이끄는 대화형 스토리로 새로운 모험을 떠나보세요.", file: "", icon: "📖" },
    "ar": { title: "AR 경험", desc: "증강 현실을 통해 현실 세계와 디지털 콘텐츠가 결합된 새로운 경험을 해보세요.", file: "", icon: "🔮" }
  };

  const listView = document.getElementById("list-view");
  const detailView = document.getElementById("detail-view");
  const type = new URLSearchParams(location.search).get("type");

  if (type && PAGES[type]) showDetailPage(type);
  else if (type) showErrorPage();
  else showListPage();

  function showListPage() {
    listView.classList.remove("hidden");
    detailView.classList.add("hidden");
    document.title = "KY restaurant2";
    document.getElementById("main-title").textContent = "콘텐츠";
    document.getElementById("main-desc").textContent = "다양한 인터랙티브 콘텐츠를 경험해보세요.";
    const container = document.getElementById("cards-container");
    container.innerHTML = "";

    Object.entries(PAGES).forEach(([key, page]) => {
      const card = document.createElement("a");
      card.href = `?type=${key}`;
      card.className = "card";
      const statusClass = page.file ? "ready" : "";
      const statusText = page.file ? "이용 가능" : "준비 중";
      card.innerHTML = `
        <div class="card-icon">${page.icon || "📦"}</div>
        <h2 class="card-title">${page.title}</h2>
        <p class="card-desc">${page.desc}</p>
        <span class="card-status ${statusClass}">${statusText}</span>
      `;
      container.appendChild(card);
    });
  }

  function showDetailPage(pageType) {
    listView.classList.add("hidden");
    detailView.classList.remove("hidden");
    const page = PAGES[pageType];
    const backLink = document.getElementById("back");
    const embed = document.getElementById("embed");
    backLink.href = HOME;
    backLink.onclick = (event) => { event.preventDefault(); location.href = HOME; };
    document.title = page.title + " | KY restaurant2";
    document.getElementById("title").textContent = page.title;
    document.getElementById("desc").textContent = page.desc;
    embed.innerHTML = "";
    if (page.file) {
      const frame = document.createElement("iframe");
      frame.src = page.file;
      frame.title = page.title;
      frame.allow = "camera; fullscreen; xr-spatial-tracking";
      embed.appendChild(frame);
      embed.classList.add("filled");
    } else {
      embed.textContent = page.title + " 콘텐츠 준비 중입니다.";
      embed.classList.remove("filled");
    }
  }

  function showErrorPage() {
    listView.classList.add("hidden");
    detailView.classList.remove("hidden");
    document.getElementById("title").textContent = "페이지를 찾을 수 없습니다";
    document.getElementById("desc").textContent = "홈으로 돌아가 카테고리를 다시 선택하세요.";
    const embed = document.getElementById("embed");
    embed.textContent = "페이지를 찾을 수 없습니다.";
    embed.classList.remove("filled");
    const backLink = document.getElementById("back");
    backLink.href = HOME;
    backLink.onclick = (event) => { event.preventDefault(); location.href = HOME; };
  }
</script>
</body>
</html>
