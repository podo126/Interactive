<!-- 온라인 2인 연결: Supabase Realtime(방 코드) + WebRTC P2P -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* =========================================================
   디자인 토큰
   ========================================================= */
:root{
  /* 사무실(도시) 컨셉 — 낮 하늘의 연파랑 바탕 + 밤 빌딩의 인디고 메인, 창문 노랑은 포인트 */
  --cream:#F4F8FF; --main:#3528a5; --main-dk:#1f1a6e; --green:var(--main); --point:#F5C542;
  --bg:#DCEAFE;                      /* 화면 바탕 (낮 하늘을 연하게) */
  --panel:#E9F1FF;                   /* 카드·칸 */
  --line:#A9C3F2;                    /* 테두리 (하늘 파랑) */
  --text:#17135C;                    /* 본문 글자 (밤하늘 남색) */
  --muted:#55639A;                   /* 보조 글자 (빌딩 그림자 파랑) */
  --accent:var(--main);              /* 강조: 버튼·점수·코드 */
  --on-accent:var(--cream);          /* 메인 색 위 글자 */
  --p1:#3D9E00; --p2:#024452; --gold:var(--green);   /* 담당 색: 양파쿵야 / 주먹밥쿵야 */
  --font:'BaekmukGulimChe',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;   /* 전체: 백묵 굴림체 */
  --font-title:var(--font);
  --key:clamp(58px,16vw,78px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{word-break:keep-all;letter-spacing:-0.02em}
.screen,.overlay .card,#hud,#controls{-webkit-text-stroke:.45px currentColor;paint-order:stroke fill}   /* 얇은 굴림체를 또렷하게 */
.btn,h2,.code,.score-total b,.pick-card b,.pill.score{-webkit-text-stroke:.7px currentColor}   /* 한글 단어 단위 줄바꿈 + 백묵 글꼴 자간 보정 */
button{font-family:var(--font-title);color:inherit;cursor:pointer;border:0;background:none}
h1,h2,.pill,.code,.score-total b,.role b,.breakdown .p,.breakdown .sum,#toast{font-family:var(--font-title)}
.btn,h2,.code,.score-total b,.role b,.pill.score,.breakdown .sum,.best{font-weight:700}   /* 굴림체는 한 굵기라 제목·버튼은 굵게 표시 */
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;font-size:1.05rem;background:var(--cream);color:var(--accent);border:2px solid var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--main-dk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-size:.95rem}
.muted{color:var(--muted)}
#msgText{white-space:pre-line}
kbd{font-family:var(--font-title);background:var(--cream);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px}

/* ---------- 이미지 교체 슬롯 (DOM) ---------- */
.img-slot{display:grid;place-items:center;border-radius:10px;font-size:.7rem;color:var(--muted);overflow:hidden;
  background:color-mix(in srgb,var(--tint,#3528a5) 14%,transparent);border:2px dashed var(--line)}
.img-slot{position:relative}
.img-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.img-slot.filled{background:none;border:0}

/* =========================================================
   화면 흐름: 메인 → 캐릭터 선택 → 방 코드 → 플레이(설명 → 시작)
   ========================================================= */
.screen{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.screen-inner{width:min(100%,400px);display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto 0}
.screen-title{font-size:1.6rem;color:var(--accent);font-weight:700}
.btn.big{font-size:1.4rem;padding:18px 16px;border-radius:18px}
/* 메인 PLAY: 버튼 블록 없이 글자만 (눌렀을 때 작아지는 효과는 .btn:active 그대로) */
#btnPlay{width:auto;align-self:center;background:none;border:0;box-shadow:none;border-radius:12px;padding:8px 28px;
  color:#DCEAFE;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:700;letter-spacing:.14em;-webkit-text-stroke:1.2px currentColor}   /* PLAY = 기존 바탕색 */
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
/* 메인: 게임 타이틀 + 플레이 버튼만 */
#lobby{background:var(--accent)}   /* 메인 화면: 바탕과 PLAY 색을 서로 바꿈 → 바탕 = 메인 인디고 */
#lobby .title-slot:not(.filled){background:rgba(220,234,254,.1);border-color:rgba(220,234,254,.45);color:rgba(220,234,254,.8)}
#lobby .screen-inner{gap:clamp(24px,7vh,64px)}
/* 타이틀 이미지 자리: 비어 있으면 점선 빈칸, 이미지를 넣으면 원본 비율로 크기만 맞춤 */
.title-slot{width:min(82vw,360px);aspect-ratio:16/9;margin:0 auto;--tint:var(--green)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}   /* 화면엔 안 보이고 검색·읽기 도구용 */
.title-slot.filled{width:auto;aspect-ratio:auto;height:auto;overflow:visible}
.title-slot.filled img{position:static;display:block;width:auto;height:auto;max-width:min(86vw,420px);max-height:clamp(120px,34vh,300px);margin:0 auto;object-fit:contain}
/* 캐릭터 선택 — 레퍼런스 구성: 가운데 질문, 괄호 모양 선택 틀, 하단 ✕ / ✓ (바탕은 다른 화면과 동일) */
#select{padding:0;overflow:hidden}
.sel-wrap{position:relative;z-index:1;width:min(100%,560px);height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + clamp(28px,9vh,80px)) 16px calc(env(safe-area-inset-bottom,0px) + clamp(20px,6vh,48px))}
.sel-q{font-size:clamp(1.15rem,4.6vw,1.5rem);color:var(--text);font-weight:700;letter-spacing:.02em}
.sel-chars{display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,28px);width:100%}
.pick-card{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;color:var(--text)}
.pick-card .frame{position:relative;width:clamp(104px,min(30vw,26vh),190px);aspect-ratio:1;display:grid;place-items:center;--b:rgba(30,24,82,.25);
  background:                                                 /* 네 모서리 괄호 */
    linear-gradient(var(--b),var(--b)) left top/26px 4px no-repeat, linear-gradient(var(--b),var(--b)) left top/4px 26px no-repeat,
    linear-gradient(var(--b),var(--b)) right top/26px 4px no-repeat, linear-gradient(var(--b),var(--b)) right top/4px 26px no-repeat,
    linear-gradient(var(--b),var(--b)) left bottom/26px 4px no-repeat, linear-gradient(var(--b),var(--b)) left bottom/4px 26px no-repeat,
    linear-gradient(var(--b),var(--b)) right bottom/26px 4px no-repeat, linear-gradient(var(--b),var(--b)) right bottom/4px 26px no-repeat;
  transition:transform .15s}
.pick-card .img-slot{width:68%;height:68%;background:none;border:0}
.pick-card .img-slot img{animation:float 2.4s ease-in-out infinite alternate}
.pick-card.p2 .img-slot img{animation-delay:-1.2s}
@keyframes float{to{transform:translateY(-6px)}}
.pick-card b{font-size:1.05rem;font-weight:700;-webkit-text-stroke:.5px currentColor;color:var(--text)}
.pick-card small{font-size:.75rem;color:var(--muted)}
.pick-card.on .frame{--b:var(--text);transform:scale(1.06)}
.pick-card.on b{color:var(--c)}
.pick-card.p1{--c:var(--p1)} .pick-card.p2{--c:var(--p2)}
.pick-card:not(.on) .img-slot{opacity:.8}
.sel-rope{flex:none;width:clamp(16px,6vw,48px);height:6px;border-radius:1px 3px 3px 1px;background:linear-gradient(#2a2a33,#15151b);align-self:center;margin-bottom:46px}
.sel-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:min(100%,420px)}
.sel-btn{display:grid;place-items:center;font-family:var(--font-title);font-weight:700;color:var(--cream);border-radius:12px}
.sel-btn.back{justify-self:start;width:58px;height:42px;font-size:1.3rem;background:#9fb3dc;border:2px solid #8199c9}
.sel-btn.ok{width:104px;height:58px;font-size:1.9rem;background:var(--accent);border:3px solid var(--main-dk);box-shadow:inset 0 0 0 3px rgba(244,248,255,.35)}
.sel-btn.ok:disabled{background:#9fb3dc;border-color:#8199c9;box-shadow:none;opacity:1;cursor:default}
.sel-btn:not(:disabled):active{transform:scale(.96)}
.sel-test{position:absolute;z-index:1;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.72rem;color:var(--muted);
  border:1.5px dashed var(--line);border-radius:999px;padding:4px 10px;background:rgba(244,248,255,.7)}
@media (orientation:landscape) and (max-height:520px){ .pick-card .frame{width:clamp(84px,26vh,120px)} .sel-wrap{padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:16px} .sel-rope{margin-bottom:40px} }
/* 방 코드 */
#roomHost,#roomGuest{display:flex;flex-direction:column;gap:12px}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;padding:12px;border-radius:14px;border:2px solid var(--accent);background:var(--cream);color:var(--accent);
  font-family:var(--font-title);font-size:1.4rem;text-align:center;letter-spacing:8px;text-transform:uppercase}
.join .btn{width:auto;flex:none;padding:12px 18px}
.status{min-height:1.4em;font-size:.9rem;color:var(--accent)}
.muted{color:var(--muted)}
/* 게임 설명 창 */
.card.intro{width:min(100%,420px);text-align:left}
.card.intro h2{text-align:center}
.intro-keys{display:flex;flex-direction:column;gap:6px}
.intro-keys .row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px}
.intro-keys .chip{font-family:var(--font-title);font-weight:700;font-size:.8rem;color:#fff;background:var(--c);padding:3px 9px;border-radius:99px;white-space:nowrap}
.intro-rules{margin:0;padding-left:1.1em;color:var(--text);font-size:.92rem;line-height:1.55}
@media (max-height:600px){ .screen-inner{gap:8px} .pick-card .img-slot{width:48px;height:48px} .screen-title{font-size:1.3rem} .btn{padding:10px 12px} .intro-rules{font-size:.82rem;line-height:1.4} }
@media (orientation:landscape) and (max-height:520px){ .screen-inner{width:min(100%,620px)} .pick{gap:14px} .title-slot{width:min(48vw,300px)} .title-slot.filled img{max-height:42vh} }

/* =========================================================
   게임 화면
   ========================================================= */
#game{position:fixed;inset:0;height:100%;height:100dvh;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* HUD: 플레이 화면(보드) 안쪽 위 — 크게, 잘 보이게 */
#hud{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;
  padding:8px 8px 0;font-family:var(--font-title)}
#hud button{pointer-events:auto}
.hud-top{display:flex;align-items:center;gap:6px}
.hud-top .sp{flex:1}
.pill{padding:5px 11px;border-radius:999px;background:rgba(244,248,255,.92);color:var(--text);border:1.5px solid var(--line);font-size:.9rem;white-space:nowrap;font-weight:700}
.pill.me{color:#fff;border-color:transparent}
.btn-sound.float{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:42px;height:42px;border-radius:50%;background:rgba(244,248,255,.92);border:2px solid var(--accent);font-size:1.1rem;display:grid;place-items:center}
body.ingame .btn-sound.float{display:none}            /* 게임 중에는 HUD의 소리 버튼 사용 */
.btn-sound.off{border-color:var(--line);opacity:.75}
.btn-sound:active{transform:scale(.93)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(244,248,255,.92);color:var(--accent);border:2px solid var(--accent);font-size:1.05rem;flex:none}
.hud-score{display:flex;align-items:baseline;gap:6px;background:var(--accent);color:var(--cream);border:2px solid var(--main-dk);border-radius:16px;
  padding:3px 16px 4px;box-shadow:0 3px 0 rgba(30,24,82,.25);margin-top:-2px}
.hud-score small{font-size:.8rem;opacity:.9;white-space:nowrap}
@media (max-width:440px){ .hud-score small{display:none} }   /* 좁은 화면: '업무 점수' 라벨은 숨기고 숫자만 (줄바꿈 방지) */
.hud-score b{font-size:clamp(1.5rem,5.6vw,2.1rem);line-height:1.1;font-weight:700;letter-spacing:.01em}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{background:rgba(244,248,255,.92);border:1.5px solid var(--line);border-radius:12px;padding:3px 4px 4px;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:clamp(.6rem,2.3vw,.75rem);color:var(--muted);font-weight:700}
.stat b{font-size:clamp(1rem,4vw,1.3rem);color:var(--text);font-weight:700}
.stat.water b{color:#1f6fc0}
@media (max-width:400px){ .hud-top{gap:4px} .icon-btn{width:33px;height:33px;font-size:.95rem;border-radius:10px} .hud-score{padding:3px 10px 4px} }
@media (max-width:360px){ .hud-score small{display:none} .pill{font-size:.78rem;padding:4px 8px} .icon-btn{width:31px;height:31px} }
@media (max-height:520px){                      /* 낮은 화면(가로 모바일): HUD 압축 */
  #hud{padding:5px 6px 0;gap:3px} .icon-btn{width:30px;height:30px;font-size:.9rem;border-radius:9px} .pill{font-size:.75rem;padding:3px 8px}
  .hud-score{padding:1px 12px 2px} .hud-score b{font-size:1.25rem} .hud-score small{font-size:.65rem}
  .hud-stats{gap:3px} .stat{padding:1px 3px 2px;border-radius:9px} .stat small{font-size:.55rem} .stat b{font-size:.88rem}
  #toast{top:calc(env(safe-area-inset-top,0px) + 48vh)} }
.stat.water.danger{background:#1f7fd6;border-color:#1f7fd6;animation:pulse .5s infinite alternate} .stat.water.danger small,.stat.water.danger b{color:#fff}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px}
#board{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px var(--accent)}
#board canvas{position:absolute;left:0;top:0;display:block}
#layer-images{pointer-events:none}

/* ---------- 모바일 조작 버튼 (게임 화면과 분리된 영역) ---------- */
#controls{display:none;flex:none;justify-content:space-between;align-items:center;padding:8px 18px 14px}
body.touch #controls{display:flex}
.move{display:flex;gap:10px;touch-action:none}
.key{width:var(--key);height:var(--key);border-radius:20px;font-size:1.5rem;touch-action:none;
  background:var(--panel);color:var(--accent);border:3px solid var(--accent);display:grid;place-items:center}
.move .key{pointer-events:none}
.key.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.key.jump{width:calc(var(--key)*1.35);height:calc(var(--key)*1.35);border-radius:50%;font-size:1.15rem}
@media (orientation:landscape){
  :root{--key:clamp(50px,17vh,76px)}
  body.touch #main{flex-direction:row}
  body.touch #controls{display:contents}
  body.touch .move{order:-1;align-self:center;gap:6px;padding:0 4px 0 12px}
  body.touch .key.jump{order:2;align-self:center;margin:0 14px 0 4px}
}

/* ---------- 오버레이 / 토스트 ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(30,24,82,.55)}
.card{width:min(100%,360px);background:var(--cream);border:3px solid var(--accent);border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(30,24,82,.25)}
.card h2{font-weight:400;font-size:1.7rem;color:var(--accent)}
.code{background:var(--cream);border:2px solid var(--accent);border-radius:14px;padding:8px 0 8px 12px;font-size:2.8rem;letter-spacing:12px;color:var(--accent);padding-left:12px}
.score-total{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0}
.score-total small{color:var(--muted);font-size:.8rem}
.score-total b{font-weight:400;font-size:2.6rem;color:var(--accent);line-height:1.1}
.score-total span{font-size:.85rem;min-height:1.2em}
.breakdown{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-size:.9rem;margin-bottom:4px}
.breakdown .v{color:var(--muted);text-align:right} .breakdown .p{text-align:right;min-width:4.5em}
.breakdown .p.minus{color:#c8462a} .breakdown .sum{grid-column:1/-1;border-top:1px solid var(--line);margin-top:2px;padding-top:6px;display:flex;justify-content:space-between}
.pill.score{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.overlay{overflow-y:auto;overscroll-behavior:contain} .overlay .card{margin:auto}
@media (max-height:620px){
  .card{padding:14px 14px;gap:7px} .card h2{font-size:1.35rem} .score-total b{font-size:2rem}
  .breakdown{font-size:.82rem;padding:8px 10px;gap:4px 10px} .card .btn{padding:10px 12px} }
@media (orientation:landscape) and (max-height:520px){
  #ovResult .card{width:min(100%,620px);display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-items:center}
  #ovResult .card h2,#ovResult .score-total{grid-column:1} #ovResult .breakdown{grid-column:2;grid-row:1/span 2}
  #ovResult .card .btn{grid-column:auto} }
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 26vh);transform:translateX(-50%);z-index:40;
  background:var(--accent);color:var(--on-accent);border:2px solid var(--main-dk);padding:9px 16px;border-radius:999px;font-size:.95rem;
  white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
</style>
</head>
<body>

<!-- ===================== ① 메인: 게임 타이틀 + 플레이 ===================== -->
<section id="lobby" class="screen">
  <div class="screen-inner">
    <h1 class="sr-only">게임 타이틀</h1>
    <!-- 게임 타이틀 이미지 자리 (IMG-00) — 이미지를 넣으면 원본 비율 그대로 표시 -->
    <div class="img-slot title-slot" data-img="IMG-00"></div>
    <button class="btn primary big" id="btnPlay">PLAY</button>
  </div>
</section>

<!-- ===================== ② 캐릭터 선택 (괄호 선택 틀 · 하단 ✕ / ✓) ===================== -->
<section id="select" class="screen" hidden>
  <div class="sel-wrap">
    <h2 class="sel-q">캐릭터 선택</h2>
    <div class="sel-chars">
      <button class="pick-card p1" data-role="P1" aria-label="양파쿵야 (Player 1, 방 만들기)">
        <span class="frame"><span class="img-slot" data-img="IMG-01"></span></span>
        <b>양파쿵야</b><small>Player 1 · 방 만들기</small>
      </button>
      <span class="sel-rope" aria-hidden="true"></span>
      <button class="pick-card p2" data-role="P2" aria-label="주먹밥쿵야 (Player 2, 코드로 입장)">
        <span class="frame"><span class="img-slot" data-img="IMG-02"></span></span>
        <b>주먹밥쿵야</b><small>Player 2 · 코드로 입장</small>
      </button>
    </div>
    <div class="sel-actions">
      <button class="sel-btn back" id="btnBackMain" aria-label="뒤로">✕</button>
      <button class="sel-btn ok" id="btnPickNext" aria-label="선택 완료" disabled>✓</button>
      <span class="sel-gap" aria-hidden="true"></span>
    </div>
  </div>
  <!-- 테스트용: 방 코드 화면을 건너뛰고 한 기기에서 두 캐릭터로 바로 플레이 -->
  <button class="sel-test" id="btnTest">테스트 · 혼자 하기</button>
</section>

<!-- ===================== ③ 방 코드 (만들기 / 입력) ===================== -->
<section id="room" class="screen" hidden>
  <div class="screen-inner">
    <h2 class="screen-title" id="roomTitle">친구 초대</h2>
    <div id="roomHost">
      <div class="code" id="waitCode">----</div>
      <button class="btn primary" id="btnInvite">코드 보내기</button>
    </div>
    <div id="roomGuest" hidden>
      <div class="join">
        <input id="inCode" maxlength="4" placeholder="코드" autocomplete="off" autocapitalize="characters">
        <button class="btn primary" id="btnJoin">입장</button>
      </div>
    </div>
    <p class="status" id="lobbyStatus"></p>
    <button class="btn ghost" id="btnRoomBack">뒤로</button>
  </div>
</section>

<!-- ===================== 게임 ===================== -->
<section id="game" hidden>
  <div id="main">
    <div id="stage">
      <div id="board">
        <!-- 레이어 1: 배경·지형 타일 (코드 드로잉) -->
        <canvas id="layer-world"></canvas>
        <!-- 레이어 2: 이미지 리소스 (반투명 박스 = 교체 대상) -->
        <canvas id="layer-images"></canvas>
        <!-- 레이어 3: 정보 표시(HUD) — 플레이 화면 안쪽 위 -->
        <div id="hud">
          <div class="hud-top">
            <span class="pill me" id="hudMe">P1</span>
            <span class="sp"></span>
            <div class="hud-score"><small>업무 점수</small><b id="hudScore">0</b></div>
            <span class="sp"></span>
            <button class="icon-btn btn-sound" aria-label="소리 끄기">🔊</button>
            <button class="icon-btn" id="btnSwap" hidden aria-label="조작 캐릭터 변경">⇄</button>
            <button class="icon-btn" id="btnRestart" aria-label="다시 시작">↻</button>
            <button class="icon-btn" id="btnExit" aria-label="나가기">✕</button>
          </div>
          <div class="hud-stats">
            <div class="stat"><small>올라간 높이</small><b id="hudHeight">0m</b></div>
            <div class="stat water" id="hudLavaBox"><small>서류까지</small><b id="hudLava">-</b></div>
            <div class="stat"><small>해낸 시간</small><b id="hudTime">00:00</b></div>
            <div class="stat"><small>보너스 점수</small><b id="hudCoins">0</b></div>
          </div>
        </div>
      </div>
    </div>
    <div id="controls">
      <div class="move" id="movePad">
        <button class="key" data-dir="left" aria-label="왼쪽">◀</button>
        <button class="key" data-dir="right" aria-label="오른쪽">▶</button>
      </div>
      <button class="key jump" id="btnJump">점프</button>
    </div>
  </div>
</section>

<!-- ④ 게임 설명 (플레이 화면 위 딤드) → 시작하기 → 3초 카운트다운 -->
<div class="overlay" id="ovIntro" hidden>
  <div class="card intro">
    <h2>게임 방법</h2>
    <div class="intro-keys" id="introKeys"></div>
    <ul class="intro-rules">
      <li>아래에서 서류가 점점 빠르게 쌓여 올라와용!</li>
      <li>점프 키를 오래 누를 수록 높이 뛰고,<br>오래 매달리거나 세게 당기면...</li>
      <li>사장님 머리를 밟고 올라가봐용! (합법)</li>
      <li>무너지는 발판, 깜빡이는 발판, 컨베이어를 조심해용!</li>
    </ul>
    <button class="btn primary" id="btnStart">시작하기</button>
    <p class="status" id="introStatus"></p>
  </div>
</div>

<!-- 결과 -->
<div class="overlay" id="ovResult" hidden>
  <div class="card">
    <h2 id="resTitle">퇴근!</h2>
    <div class="score-total"><small>업무 점수</small><b id="resScore">0</b><span id="resBestTag"></span></div>
    <div class="breakdown" id="resBreak"></div>
    <button class="btn primary" id="btnShare">결과 공유하기</button>
    <button class="btn" id="btnRetry">다시 하기</button>
    <button class="btn ghost" id="btnHome">처음으로</button>
  </div>
</div>

<!-- 알림/오류 -->
<div class="overlay" id="ovMsg" hidden>
  <div class="card">
    <h2 id="msgTitle">알림</h2>
    <p class="muted" id="msgText"></p>
    <button class="btn primary" id="btnMsgReload" hidden>새로고침</button>
    <button class="btn primary" id="btnMsgOk">처음으로</button>

const HITBOX_INSET = { x:0, top:0 };
function charHitbox(id){
  const im=IMAGES[PLAYERS[id].img], src=im._img;
  if(src && src.complete && src.naturalWidth && im.body){
    const sc=CHAR_BODY/im.body, fullH=src.naturalHeight*sc, cut=fullH*(im.hitTop||0)+HITBOX_INSET.top;
    return { w:Math.round(src.naturalWidth*sc)-HITBOX_INSET.x*2, h:Math.round(fullH-cut), sc, fullH, top:fullH-Math.round(fullH-cut) };   // top: 판정 위로 튀어나온 그림 높이
  }
  return { w:PHYS.W, h:PHYS.H, sc:0, fullH:PHYS.H, top:0 };   // 이미지가 없으면 기본 크기
}

   BGM 파일은 index.html과 같은 폴더에 둠 (저장소에 bgm.mp3 함께 업로드)

// BGM 2곡: 낮(메인 화면 ~ 게임 낮 배경) / 밤(게임 밤 배경). 배경이 바뀌는 높이에서 서서히 겹치며 전환
const SOUND = {
  BGM_DAY:'bgm.mp3', BGM_NIGHT:'bgm_night.mp3',   // 파일 경로 (index.html과 같은 폴더)
  BGM_VOL:0.45,       // 음량(0~1)
  FADE:2.5,           // 전환할 때 서서히 바뀌는 시간(초)
  NIGHT_AT:140,       // 화면 높이가 이 값(m) 이상이면 밤 BGM (배경은 150m에 완전히 밤)
  DAY_AT:120,         // 이 값 아래로 내려오면 다시 낮 BGM (사이 구간에서는 바뀌지 않아 자주 오가지 않음)
};
let soundOn = (()=>{ try{ return localStorage.getItem('duo-sound')!=='off'; }catch(e){ return true; } })();
const BGM_TRACKS = { day:new Audio(), night:new Audio() };
BGM_TRACKS.day.src=SOUND.BGM_DAY; BGM_TRACKS.night.src=SOUND.BGM_NIGHT;
for(const a of Object.values(BGM_TRACKS)){ a.loop=true; a.preload='auto'; a.volume=0; }
let bgmWant='day', bgmStarted=false;
function bgmPlay(){                                   // 지금 들려야 할 곡 재생 (첫 터치 이후)
  if(!soundOn || document.hidden) return;
  const a=BGM_TRACKS[bgmWant]; if(!bgmStarted){ a.volume=SOUND.BGM_VOL; bgmStarted=true; }
  const pr=a.play(); if(pr && pr.catch) pr.catch(()=>{});
}
function bgmPauseAll(){ for(const a of Object.values(BGM_TRACKS)) a.pause(); }
function bgmTick(dt){                                 // 매 프레임: 낮/밤 곡 음량을 목표 쪽으로 서서히 이동
  if(!soundOn || document.hidden || !bgmStarted) return;
  const step=SOUND.BGM_VOL*dt/Math.max(.1,SOUND.FADE);
  for(const [k,a] of Object.entries(BGM_TRACKS)){
    const goal = k===bgmWant ? SOUND.BGM_VOL : 0;
    a.volume = goal>a.volume ? Math.min(goal, a.volume+step) : Math.max(goal, a.volume-step);
    if(goal>0 && a.paused){ const pr=a.play(); if(pr && pr.catch) pr.catch(()=>{}); }
    if(goal===0 && a.volume<=0.001 && !a.paused) a.pause();
  }
}
function updateBgmWant(){                             // 메인·결과 화면 = 낮, 게임 중 = 화면 높이에 따라
  const inGame = !$('#game').hidden && (S.phase==='count' || S.phase==='run' || S.phase==='intro');
  if(!inGame){ bgmWant='day'; return; }
  const m=S.viewM||0;
  if(m>=SOUND.NIGHT_AT) bgmWant='night'; else if(m<SOUND.DAY_AT) bgmWant='day';
}
function setSound(on){
  soundOn=on; try{ localStorage.setItem('duo-sound', on?'on':'off'); }catch(e){}
  if(on){ bgmPlay(); if(actx && actx.state==='suspended') actx.resume(); } else bgmPauseAll();
  updateSoundBtns();
}

let landBufs=[], landLoading=false; const lastLand={};
function loadLandSfx(){
  if(landLoading) return; landLoading=true;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  LAND_SFX.SRC.forEach((b,i)=>{ try{ const bin=atob(b), buf=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) buf[k]=bin.charCodeAt(k);
    actx.decodeAudioData(buf.buffer, d=>{ landBufs[i]=d; }, ()=>{}); }catch(e){} });
}
function playLand(id){
  if(!soundOn) return; const t=now(); if(t-(lastLand[id]||0)<90) return; lastLand[id]=t;
  loadLandSfx(); const ready=landBufs.filter(Boolean); if(!ready.length || !actx) return;
  try{ if(actx.state==='suspended') actx.resume();
    const src=actx.createBufferSource(), g=actx.createGain();
    src.buffer=ready[Math.floor(Math.random()*ready.length)]; src.playbackRate.value=1-LAND_SFX.PITCH/2+Math.random()*LAND_SFX.PITCH;
    g.gain.value=LAND_SFX.VOL; src.connect(g).connect(actx.destination); src.start(); }catch(e){}
}
function sweep(f1,f2,d=.12,type='sine',vol=.04){   // 주파수가 f1→f2로 변하는 효과음
  if(!soundOn) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); }catch(e){}
}
function sfx(f=440,d=.1,type='square',vol=.05){
  if(!soundOn) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d); }catch(e){}
}

   ========================================================= */
const TS=PHYS.TILE, MW=ENDLESS.W, MH=ENDLESS.H+24, WORLD_W=MW*TS, WORLD_H=MH*TS;
const FL_ROW = MH-3;                                   // 바닥(높이 0m) 윗면이 있는 행
const grid=[]; for(let y=0;y<MH;y++) grid.push(new Array(MW).fill(' '));
const COINS=[], MOVERS=[];
const STARTS={ P1:{cx:6*TS+TS/2, bottom:FL_ROW*TS}, P2:{cx:3*TS+TS/2, bottom:FL_ROW*TS} };
const isSolid = c => c==='#' || c==='B' || c==='S' || c==='~' || c==='=' || c==='>' || c==='<';
const crumbleKey = (tx,ty) => { let x=tx; while(x>1 && grid[ty][x-1]==='C') x--; return ty+':'+x; };   // 이어진 무너짐 발판은 한 덩어리
function crumbleState(tx,ty){ const at=S.crumble && S.crumble.get(crumbleKey(tx,ty)); if(at==null) return {solid:true,shake:0};
  const d=gameTime()-at; if(d<CRUMBLE.FALL) return {solid:true,shake:d/CRUMBLE.FALL};
  if(d<CRUMBLE.FALL+CRUMBLE.BACK) return {solid:false,back:(d-CRUMBLE.FALL)/CRUMBLE.BACK}; return {solid:true,shake:0}; }
function blinkPhase(ty){ const t=Math.max(0,gameTime()); return ((t/BLINK.PERIOD)+((ty*0.37)%1))%1; }
function solidAt(tx,ty){ const c=tileAt(tx,ty);
  if(c==='C') return crumbleState(tx,ty).solid;
  if(c==='T') return blinkPhase(ty) < BLINK.ON;
  return isSolid(c); }
const tileAt = (tx,ty) => (tx<0||tx>=MW) ? '#' : (ty<0||ty>=MH) ? ' ' : grid[ty][tx];
function rng32(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
let WORLD_PATH=[];
function buildWorld(seed){
  const R=rng32(seed), ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) grid[y][x] = (x===0||x===MW-1||y>=FL_ROW) ? '#' : ' ';
  COINS.length=0; MOVERS.length=0;
  const put=(x,hb,c)=>{ const y=FL_ROW-hb; if(y>=0 && y<FL_ROW && x>0 && x<MW-1) grid[y][x]=c; };   // hb: 타일 윗면 높이(칸)
  const hist=[], path=[];
  // 새 발판 바로 아래 5칸(점프대는 9칸) 안에 있는 발판과 겹치면 점프할 때 머리가 막히므로 금지
  const blocked=(x0,x1,h)=>hist.some(p=>{ const dy=h-p.hb; return dy>0 && dy<=(p.spring?9:5) && x0<=p.x1+1 && x1>=p.x0-1; });
  let prev={x0:1,x1:10,ex0:1,ex1:10,hb:0,dy:3}, dir=1;
  path.push({x0:prev.x0,x1:prev.x1,hb:0,kind:'floor'});
  hist.push({x0:1,x1:9,hb:0});                    // 시작 지점 위는 비워 둠
  while(prev.hb < ENDLESS.H-12){
    const d=Math.min(1, prev.hb/GEN.HARD_AT), band=BANDS[Math.floor(prev.hb/BAND_M)%BANDS.length];
    const wMax=Math.max(GEN.W_MIN, Math.round(GEN.W_START-3*d));
    let kind='plat';
    if(!prev.spring && !prev.gull){
      if(prev.hb>=GEN.SPRING_FROM && R()<GEN.SPRING_P) kind='spring';
      else if(prev.hb>=GEN.GULL_FROM && R()<GEN.GULL_P+(GEN.GULL_P_MAX-GEN.GULL_P)*d) kind='gull';
    }
    if(!prev.spring && prev.dy===3 && R()<GEN.TURN_P) dir=-dir;   // 방향 전환은 직전이 3칸 높이일 때만 (아래 발판과 겹침 방지)
    let placed=null;
    for(const k of (kind==='plat'?['plat']:[kind,'plat'])){ if(placed) break; kind=k;   // 특수 발판이 안 들어가면 일반 발판으로
    for(let t=0; t<20 && !placed; t++){
      const dir2 = t<10 ? dir : -dir;
      const dy = prev.spring ? 6 : ((t%10)>=5 || R()<0.45+0.35*d) ? 3 : 2;
      const w = kind==='gull' ? 3 : prev.spring ? Math.max(3,ri(GEN.W_MIN,wMax)) : ri(GEN.W_MIN, wMax);   // 점프대 착지 발판은 3칸 이상
      let x0;
      if(prev.spring){ if(dir2!==dir) continue; x0 = dir2>0 ? prev.sx+3 : prev.sx-2-w; }   // 점프대 기둥과 2칸 띄움 (올라가며 머리 부딪힘 방지)
      else { const gap = kind==='gull' ? 1 : ri(1, Math.min((prev.ice||prev.gull)?2:3, 1+Math.round(2*d)));   /* 얼음·갈매기에서 출발하면 간격 좁게 */ x0 = dir2>0 ? prev.ex1+1+gap : prev.ex0-gap-w; }
      const sw = kind==='gull' ? dir2*ri(3,4) : 0;
      const rx0=Math.min(x0,x0+sw), rx1=Math.max(x0+w-1,x0+w-1+sw), h2=prev.hb+dy;
      if(rx0<1 || rx1>MW-2) continue;
      if(kind==='spring'){ const sx = dir2>0 ? x0+w-1 : x0; if(dir2>0 ? sx+9>MW-2 : sx-9<1) continue; }   // 점프대 앞쪽에 착지 발판 + 한 칸 더 갈 공간 필요
      if(blocked(rx0,rx1,h2)) continue;
      const room = dir2>0 ? (MW-2)-rx1 : rx0-1;
      if(room<4 && dy!==3 && !prev.spring) continue;     // 곧 벽에서 꺾어야 하면 3칸 높이로 (꺾을 때 아래와 안 겹치게)
      placed={x0,x1:x0+w-1,ex0:rx0,ex1:rx1,hb:h2,dir:dir2,sw,dy};
    }
    }
    if(!placed){ path.fallbacks=(path.fallbacks||0)+1;   // 막혔을 때: 3칸 위, 겹침 기준을 완화해서 가까운 곳에
      kind='plat';
      for(let t=0; t<24 && !placed; t++){
        const dir2 = t<12 ? -dir : dir, w=2+(t%2), gap=1+(t%3), lim=t<16?3:2;
        const x0 = dir2>0 ? prev.ex1+1+gap : prev.ex0-gap-w, h2=prev.hb+3;
        if(x0<1 || x0+w-1>MW-2) continue;
        if(hist.some(q=>{ const dy=h2-q.hb; return dy>0 && dy<=(q.spring?9:lim) && x0<=q.x1+1 && x0+w-1>=q.x0-1; })) continue;
        placed={x0,x1:x0+w-1,ex0:x0,ex1:x0+w-1,hb:h2,dir:dir2,sw:0,dy:3};
      }
      if(!placed){ const w=2, x0 = dir>0 ? Math.min(MW-3, prev.ex1+2) : Math.max(1, prev.ex0-3); placed={x0,x1:x0+w-1,ex0:x0,ex1:x0+w-1,hb:prev.hb+2,dir,sw:0,dy:2}; }
    }
    dir=placed.dir;
    const P=placed, dd=Math.min(1,P.hb/GEN.HARD_AT), bnd=BANDS[Math.floor(P.hb/BAND_M)%BANDS.length];
    if(kind==='gull'){
      MOVERS.push({ x:P.x0, hb:P.hb, w:P.x1-P.x0+1, dx:P.sw, dy:0, period:+(3.8-1.4*dd).toFixed(2), phase:+R().toFixed(2) });
      P.gull=true;
    } else {
      let tile = (kind==='spring' || prev.spring) ? (bnd.tile==='~'?'B':bnd.tile) : (R()<Math.min(.9,bnd.ice*GEN.ICE_MUL*(0.5+0.5*dd)) ? '~' : bnd.tile);
      if(kind==='plat' && !prev.spring && P.hb>=GEN.GIMMICK_FROM && R()<GEN.GIMMICK_P+(GEN.GIMMICK_P_MAX-GEN.GIMMICK_P)*dd){   // 새 기믹
        let r=R(), g='C'; for(const [k2,v] of Object.entries(GEN.GIMMICK_MIX)){ if(r<v){ g=k2; break; } r-=v; }
        if(g==='>' ) g = R()<.5 ? '>' : '<';
        if((g==='>'||g==='<') && P.x1-P.x0+1<CONVEYOR.MIN_W) g = R()<.5 ? 'C' : 'T';   // 컨베이어는 3칸 이상
        if(g===prev.gim || ((g==='>'||g==='<') && (prev.gim==='>'||prev.gim==='<'))) g = g==='C' ? 'T' : 'C';   // 같은 기믹 연속은 피함
        tile=g; P.gim=g;
      }
      if(tile==='~' && P.x1-P.x0<2) tile = bnd.tile==='~' ? 'B' : bnd.tile;   // 2칸짜리는 얼음 금지 (미끄러져 바로 떨어짐)
      P.ice = tile==='~';
      for(let x=P.x0;x<=P.x1;x++) put(x,P.hb,tile);
      if(kind==='spring'){ P.sx = dir>0 ? P.x1 : P.x0; put(P.sx,P.hb+1,'S'); P.spring=true; hist.push({x0:P.sx,x1:P.sx,hb:P.hb+1,spring:true}); }
      if(R()<GEN.COIN_P){ const cx=Math.round((P.x0+P.x1)/2), row=FL_ROW-P.hb-2;
        if(row>0 && grid[row][cx]===' ' && grid[row+1][cx]===' '){
          const ok=BONUS.map((b,i)=>[i,b]).filter(([i,b])=>P.hb>=b.from), tw=ok.reduce((a,[,b])=>a+b.weight,0); let r=R()*tw, kind=0;
          for(const [i,b] of ok){ if(r<b.weight){ kind=i; break; } r-=b.weight; }
          COINS.push({i:COINS.length, kind, x:cx*TS+TS/2, y:row*TS+TS/2}); } }
    }
    hist.push({x0:P.ex0,x1:P.ex1,hb:P.hb});
    if(!prev.spring) hist.push({ x0:Math.min(prev.ex1,P.ex1,prev.ex0,P.ex0), x1:Math.max(prev.ex0,P.ex0,prev.ex1,P.ex1), hb:prev.hb });   // 점프 경로(통로)도 비워 둠
    path.push({x0:P.x0,x1:P.x1,hb:P.hb,kind,sw:P.sw||0});
    prev=P;
  }
  // 점프 경로 바로 위(5~6칸)에 다른 발판이 있으면 머리가 살짝 걸려 점프가 낮아짐 → 출발·도착 발판의 얼음을 일반 발판으로
  for(let i=0;i+1<path.length;i++){ const A=path[i], B=path[i+1]; if(A.kind==='gull'||B.kind==='gull'||A.kind==='floor') continue;
    const lo=Math.min(A.x0,B.x0)-1, hi=Math.max(A.x1,B.x1)+1;
    const tight=path.some(q=>{ const dy=q.hb-A.hb; const qx0=Math.min(q.x0,q.x0+(q.sw||0)), qx1=Math.max(q.x1,q.x1+(q.sw||0)); return dy>=5 && dy<=6 && qx0<=hi && qx1>=lo; });
    if(tight) for(const P of [A,B]) for(let x=P.x0;x<=P.x1;x++){ const y=FL_ROW-P.hb; if(grid[y][x]==='~') grid[y][x]='B'; }
  }
  WORLD_PATH=path;
  rebuildMovers();
  return path;
}

const S = {

  hb:{ P1:{w:PHYS.W,h:PHYS.H}, P2:{w:PHYS.W,h:PHYS.H} }, pl:{}, remote:null, disp:{}, fx:[], zone:0, strain:0, ropeBroken:false, snapped:false, snapAt:0, warned:false,
};
function spawnPos(id){ const b=S.hb[id], s=STARTS[id]; return { x:s.cx-b.w/2, y:s.bottom-b.h }; }
function makeBody(id){ const s=spawnPos(id);
  return { id, x:s.x, y:s.y, w:S.hb[id].w, h:S.hb[id].h, vx:0, vy:0, grounded:false, onPartner:false, coyote:0, buf:0,
           holding:false, jumpT:0, prevJump:false, face:1, safeX:s.x, safeY:s.y, peakY:s.y, gTile:'' }; }
function resetRound(){
  S.hb = { P1:charHitbox('P1'), P2:charHitbox('P2') };
  S.falls=0; S.best=0; S.cause=''; S.milestone=0; S.lava={y:FLOOR_Y+LAVA.START_BELOW*TS, v:0}; S.coins.clear(); S.crumble=new Map(); S.fx=[]; S.zone=-1; S.strain=0; S.ropeBroken=false; S.snapped=false; S.snapAt=0; S.warned=false; S.mvT=0; setMovers(0,false);
  S.pl={ P1:makeBody('P1'), P2:makeBody('P2') };
  const o=S.mode==='solo'?null:(S.me==='P1'?'P2':'P1');
  S.remote = o ? { ...S.pl[o], at:now() } : null;
  S.disp = { P1:{x:S.pl.P1.x,y:S.pl.P1.y,w:S.pl.P1.w,h:S.pl.P1.h}, P2:{x:S.pl.P2.x,y:S.pl.P2.y,w:S.pl.P2.w,h:S.pl.P2.h} };
}
const other = id => id==='P1'?'P2':'P1';
const FLOOR_Y = FL_ROW*TS;
const MV = [];
function rebuildMovers(){ MV.length=0; MOVERS.forEach((m,i)=>{ const off=(m.w*TS-GULL.HIT_W)/2;   // 판정은 칸 가운데의 몸통 폭만
  MV.push({ ...m, i, w:GULL.HIT_W, h:MOVER_H, x0:m.x*TS+off, y0:FLOOR_Y-m.hb*TS, x:m.x*TS+off, y:FLOOR_Y-m.hb*TS, dX:0, dY:0 }); }); }
function moverPos(m,t){ const s=0.5-0.5*Math.cos(2*Math.PI*(Math.max(0,t)/m.period+m.phase)); return [m.x0+m.dx*TS*s, m.y0-m.dy*TS*s]; }
buildWorld(1);
function setMovers(t, step){ for(const m of MV){ const [x,y]=moverPos(m,t); m.dX=step?x-m.x:0; m.dY=step?y-m.y:0; m.x=x; m.y=y; } }
const heightM = bottom => Math.max(0, Math.round((FLOOR_Y-bottom)/TS*GAME.METER_PER_TILE));   // 발(바닥면) 높이 기준
const isLocal = id => S.mode==='solo' || id===S.me;
const gameTime = () => S.phase==='over' ? S.endT : (now()-S.startAt)/1000;
const localIds = () => S.mode==='solo' ? ['P1','P2'] : [S.me];

// 상대 몸 (솔로: 실제 몸 / 온라인: 마지막 수신 상태 + 짧은 예측)
function partnerOf(id){
  if(S.mode==='solo') return S.pl[other(id)];
  const r=S.remote; if(!r) return null;
  const age=Math.min(.1,(now()-r.at)/1000);
  const ob=S.hb[other(id)], b={ x:r.x+r.vx*age, y:r.y+Math.min(0,r.vy)*age, w:ob.w, h:ob.h, vx:r.vx, vy:r.vy, grounded:r.grounded };
  if(solidHit(b)){ b.x=r.x; b.y=r.y; unstick(b); }
  return b;
}

/* =========================================================
   물리
   ========================================================= */
function moveX(p,dx){
  const n=Math.ceil(Math.abs(dx)/8)||1, s=dx/n;
  for(let i=0;i<n;i++){
    p.x+=s;
    const ty0=Math.floor(p.y/TS), ty1=Math.floor((p.y+p.h-1)/TS);
    const tx = s>0 ? Math.floor((p.x+p.w-1)/TS) : Math.floor(p.x/TS);
    for(let ty=ty0; ty<=ty1; ty++) if(solidAt(tx,ty)){
      p.x = s>0 ? tx*TS-p.w : (tx+1)*TS; p.vx=0; return; }
    if(s!==0) for(const m of MV) if(p.x<m.x+m.w && p.x+p.w>m.x && p.y<m.y+m.h-4 && p.y+p.h>m.y+4){   // 발판 옆면 (윗면에 살짝 닿은 건 제외)
      p.x = s>0 ? m.x-p.w : m.x+m.w; p.vx=0; return; }
  }
}
function moveY(p,dy,partner){
  const n=Math.ceil(Math.abs(dy)/8)||1, s=dy/n;
  for(let i=0;i<n;i++){
    const prevBottom=p.y+p.h; p.y+=s;
    const tx0=Math.floor(p.x/TS), tx1=Math.floor((p.x+p.w-1)/TS);
    if(s>0){
      const ty=Math.floor((p.y+p.h-0.01)/TS), top=ty*TS;
      for(let tx=tx0; tx<=tx1; tx++){ const c=tileAt(tx,ty);
        if(c==='S'){ p.y=top-p.h; p.vy=-PHYS.SPRING_V; p.holding=false; S.springAt=now(); sfx(300,.18,'sine',.07); sfx(600,.18,'sine',.04); return; }
        if(solidAt(tx,ty)){ p.y=top-p.h; p.gTile=c; land(p,false); if(c==='C') triggerCrumble(tx,ty,p); return; } }
      for(const m of MV) if(p.x+p.w>m.x+1 && p.x<m.x+m.w-1 && prevBottom<=m.y+Math.abs(m.dY)+1 && p.y+p.h>=m.y){
        p.y=m.y-p.h; p.gTile='mover'; land(p,false); p.onMover=m.i; return; }
      // 친구 머리 = 밟을 수 있는 발판
      if(partner && prevBottom<=partner.y+8 && p.y+p.h>=partner.y && p.x+p.w>partner.x+3 && p.x<partner.x+partner.w-3){
        if(!solidHit({x:p.x, y:partner.y-p.h, w:p.w, h:p.h})){ p.y=partner.y-p.h; p.gTile='head'; land(p,true); return; } }
    } else if(s<0){
      const ty=Math.floor(p.y/TS);
      for(let tx=tx0; tx<=tx1; tx++) if(solidAt(tx,ty)){ p.y=(ty+1)*TS; p.vy=0; p.holding=false; return; }
      for(const m of MV) if(p.x+p.w>m.x && p.x<m.x+m.w && p.y<m.y+m.h && p.y+p.h>m.y+m.h){ p.y=m.y+m.h; p.vy=0; p.holding=false; return; }
    }
  }
}
// ---- 끼임 방지: 몸이 벽 안에 들어가면 가장 가까운 빈 곳으로 밀어냄 ----
function solidHit(b){
  const tx0=Math.floor(b.x/TS), tx1=Math.floor((b.x+b.w-0.01)/TS), ty0=Math.floor(b.y/TS), ty1=Math.floor((b.y+b.h-0.01)/TS);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++) if(solidAt(tx,ty)) return {x:tx*TS,y:ty*TS,w:TS,h:TS};
  for(const m of MV) if(b.x<m.x+m.w && b.x+b.w>m.x && b.y<m.y+m.h && b.y+b.h>m.y) return m;
  return null;
}
function unstick(b, maxMove=Infinity){
  const ox=b.x, oy=b.y;
  for(let k=0;k<6;k++){
    const r=solidHit(b); if(!r) return true;
    const opts=[['x',r.x-(b.x+b.w)],['x',r.x+r.w-b.x],['y',r.y-(b.y+b.h)],['y',r.y+r.h-b.y]]
      .sort((a,c)=>Math.abs(a[1])-Math.abs(c[1]));
    const pick = opts.find(([ax,v])=>!solidHit({x:b.x+(ax==='x'?v:0), y:b.y+(ax==='y'?v:0), w:b.w, h:b.h})) || opts[0];
    const [ax,v]=pick; b[ax]+=v;
    if(Math.abs(b.x-ox)+Math.abs(b.y-oy) > maxMove){ b.x=ox; b.y=oy; return false; }
    if(ax==='x' && b.vx!==undefined && Math.sign(b.vx)===-Math.sign(v)) b.vx=0;
    if(ax==='y' && b.vy!==undefined && Math.sign(b.vy)===-Math.sign(v)) b.vy=0;
  }
  return !solidHit(b);
}
function triggerCrumble(tx,ty,p){                          // 무너짐 발판을 밟음 → 두 기기에 같은 시각으로 기록
  if(!p.id || !isLocal(p.id) || S.phase!=='run') return;
  const k=crumbleKey(tx,ty), at=S.crumble.get(k);
  if(at!=null && gameTime()-at < CRUMBLE.FALL+CRUMBLE.BACK) return;
  const t=gameTime(); S.crumble.set(k,t); net.send({t:'crumble', k, at:t}); sfx(180,.12,'square',.03);
}
function land(p,onPartner){
  if(!p.grounded && p.id && isLocal(p.id) && S.phase==='run'){        // 추락 판정 (최고점 → 착지 높이)
    if(!p.wasGrounded && !onPartner && gameTime()>0.3) playLand(p.id);   // 공중→착지 순간만 소리 (친구 머리 위 착지·출발 직후 제외)
    const drop=(p.y-p.peakY)/TS;
    if(drop>=GAME.FALL_TILES) registerFall(p.id, Math.round(drop*GAME.METER_PER_TILE), true);
  }
  p.vy=0; p.grounded=true; p.onPartner=onPartner; p.peakY=p.y;
}
/* ---------- 로프 과부하 ----------
   게이지(S.strain 0~1)가 1이 되면 끊어짐
   · 쌓임: 한 명은 발판 위, 다른 한 명은 줄에 매달려 아래에 있을 때 (초당 1/HANG_LIMIT)
   · 쌓임: 떨어지다 줄에 '확' 걸릴 때 충격량만큼
   · 회복: 줄이 느슨하거나 매달린 사람이 없을 때
   판정은 솔로/방장 기기에서만 하고 참여자에게 게이지를 전송 */
const ropeJudge = () => ROPE.BREAK && (S.mode==='solo' || S.mode==='host');
function ropeJerk(v){
  if(!ROPE.BREAK || S.ropeBroken || v<ROPE.JERK_MIN || S.phase!=='run') return;
  const add=(v-ROPE.JERK_MIN)/ROPE.JERK_DIV;
  if(ropeJudge()) addStrain(add); else net.send({t:'jerk',a:add});
}
function addStrain(a){ if(S.ropeBroken) return; S.strain=Math.max(0,S.strain+a); if(S.strain>=1) snapRope(); }
function updateStrain(dt){
  if(!ropeJudge() || S.ropeBroken || S.phase!=='run') return;
  const A = S.mode==='solo' ? S.pl.P1 : S.pl[S.me], B = S.mode==='solo' ? S.pl.P2 : partnerOf(S.me);
  if(!B) return;
  const d=Math.hypot((A.x+A.w/2)-(B.x+B.w/2),(A.y+A.h/2)-(B.y+B.h/2));
  const taut = d >= ROPE.MAX-6;
  const hanging = taut && ((A.grounded && !B.grounded && B.y > A.y+20) || (B.grounded && !A.grounded && A.y > B.y+20));
  if(hanging) addStrain(dt/ROPE.HANG_LIMIT);
  else S.strain=Math.max(0, S.strain-ROPE.RECOVER*dt);
}
function snapRope(){
  if(S.ropeBroken) return;
  S.ropeBroken=true; S.snapped=true; S.cause='rope'; S.strain=1; S.snapAt=now();
  sfx(90,.5,'sawtooth',.1); sfx(1400,.08,'square',.06); if(navigator.vibrate) navigator.vibrate([60,40,120]);
  toast('로프가 끊어졌어요!', 2000);
  if(S.mode==='host') net.send({t:'snap'});
  setTimeout(()=>endRound('over'), 1600);     // 끊어진 뒤 잠깐 떨어지는 모습 보여주고 종료
}
let creakAt=0;
function strainFeedback(){
  if(S.ropeBroken || S.phase!=='run') return;
  if(S.strain>=ROPE.WARN){
    if(!S.warned){ S.warned=true; toast('Warning!', 1800); }
    const gap = 520 - S.strain*320;
    if(now()-creakAt>gap){ creakAt=now(); sfx(140+S.strain*120,.07,'sawtooth',.035); if(navigator.vibrate && S.strain>.85) navigator.vibrate(25); }
  } else if(S.strain<ROPE.WARN*.5) S.warned=false;
}
/* ---------- 아래에서 올라오는 용암 ----------
   방장(또는 솔로)이 위치를 계산하고 참여자에게 전송 (0.25초마다) */
function updateLava(dt){
  if(S.phase!=='run') return;
  if(S.mode==='guest'){ S.lava.y -= S.lava.v*dt; return; }
  const t=gameTime(); if(t<LAVA.DELAY) return;
  let v=Math.min(LAVA.VMAX, LAVA.V0+LAVA.ACC*(t-LAVA.DELAY));
  const A=S.pl[S.me], B=S.mode==='solo'?S.pl[other(S.me)]:partnerOf(S.me);
  const lowest=Math.max(A.y+A.h, B?B.y+B.h:-1e9);
  if(S.lava.y-lowest > LAVA.CATCHUP_ROWS*TS) v*=LAVA.CATCHUP_MUL;   // 너무 멀리 떨어져 있으면 빠르게 따라옴
  if(S.mode==='solo' && TEST_EASY.ON) v*=TEST_EASY.WATER_MUL;      // 혼자 테스트는 천천히
  S.lava.v=v; S.lava.y-=v*dt;
  if(S.mode==='host' && now()-S.lastLavaSend>250){ S.lastLavaSend=now(); net.send({t:'lava', y:Math.round(S.lava.y), v:Math.round(v*10)/10}); }
}
const lavaGapM = () => { const lowest=Math.max(S.disp.P1.y+S.disp.P1.h, S.disp.P2.y+S.disp.P2.h); return Math.max(0, Math.round((S.lava.y-lowest)/TS)); };
function gameOver(cause){
  if(S.phase!=='run') return;
  S.cause=cause; net.send({t:'over', cause});
  if(cause==='lava'){ sweep(700,90,.45,'sine',.08); sweep(320,60,.6,'triangle',.05); if(navigator.vibrate) navigator.vibrate([80,40,160]); toast('야근이에요!!', 2000); }
  endRound('over');
}
function ropeSound(dt){
  if(!ROPE_SFX.ON || S.ropeBroken || S.phase!=='run' || dt<=0) { S.ropeLenPrev=null; return; }
  const a=S.disp.P1, b=S.disp.P2, d=Math.hypot((a.x+a.w/2)-(b.x+b.w/2),(a.y+a.h/2)-(b.y+b.h/2));
  const prev = S.ropeLenPrev==null ? d : S.ropeLenPrev; S.ropeLenPrev=d;
  const rate=(d-prev)/dt, t=now(), ready = t-(S.ropeSfxAt||0) > ROPE_SFX.GAP;
  if(d>ROPE.REST && rate>ROPE_SFX.STRETCH_RATE && ready){                 // 늘어남
    S.ropeSfxAt=t; S.ropeTaut=true;
    const k=clamp((d-ROPE.REST)/(ROPE.MAX-ROPE.REST),0,1);
    sweep(170+k*230, 210+k*330, .09, 'triangle', ROPE_SFX.VOL*(0.6+0.6*k));
  } else if(S.ropeTaut && rate<ROPE_SFX.RELEASE_RATE && ready){            // 팽팽했다가 줄어듦
    S.ropeSfxAt=t; S.ropeTaut=false;
    sweep(460,130,.18,'sine',ROPE_SFX.VOL*1.3);
  }
  if(d<ROPE.REST-10) S.ropeTaut=false;
}
function registerFall(id, m, local){
  S.falls++; sfx(220,.25,'triangle',.06); setTimeout(()=>sfx(150,.3,'triangle',.05),120);
  toast('추락!', 1600);

}

function doJump(p, assist){
  p.vy=-PHYS.JUMP_V; p.holding=true; p.jumpT=0; p.buf=0; p.coyote=0; p.grounded=false;
  if(assist){ p.assistCd=ROPE.ASSIST_CD; popFx('로프 점프!', '#ffcf4a', p); sfx(700,.12,'triangle'); } else sfx(420,.08,'triangle',.04);
}

function stepBody(id, dt){
  const p=S.pl[id], inp=inputOf(id), q=partnerOf(id), rope=S.ropeBroken?null:q;   // q: 친구 몸(머리 밟기), rope: 줄 효과
  // 좌우 이동
  const dir=(inp.right?1:0)-(inp.left?1:0), ice=p.grounded && p.gTile==='~';
  if(!p.grounded) p.peakY=Math.min(p.peakY, p.y);
  if(dir){ p.vx += dir*(p.grounded?PHYS.ACCEL*(ice?PHYS.ICE_ACCEL:1):PHYS.AIR_ACCEL)*dt; if(Math.abs(p.vx)>PHYS.RUN && Math.sign(p.vx)===dir) p.vx=dir*Math.max(PHYS.RUN, Math.abs(p.vx)-PHYS.FRICTION*dt); p.face=dir; }
  else { const f=(p.grounded?(ice?PHYS.ICE_FRICTION:PHYS.FRICTION):300)*dt; p.vx = Math.abs(p.vx)<=f ? 0 : p.vx-Math.sign(p.vx)*f; }
  // 점프 (버퍼 + 코요테 타임 + 로프 보조)
  if(inp.jump && !p.prevJump) p.buf=PHYS.BUFFER;
  p.prevJump=inp.jump;
  p.buf-=dt; p.coyote = p.grounded ? PHYS.COYOTE : p.coyote-dt; p.assistCd=(p.assistCd||0)-dt;
  if(p.buf>0){
    if(p.coyote>0) doJump(p,false);
    else if((p.assistCd||0)<=0 && rope && q.grounded && (q.y+q.h) < (p.y+p.h) - ROPE.ASSIST_DY) doJump(p,true);
  }
  // 가변 점프 높이: 누르고 있으면 중력 감소, 떼면 상승 속도 컷
  if(p.holding){
    if(!inp.jump){ p.holding=false; if(p.vy<0) p.vy*=PHYS.CUT; }
    else if((p.jumpT+=dt) >= PHYS.HOLD_T) p.holding=false;
  }
  p.vy = Math.min(PHYS.MAX_FALL, p.vy + PHYS.GRAVITY*((p.holding&&p.vy<0)?PHYS.HOLD_GRAV:1)*dt);
  // 고무줄 탄성
  if(rope){ const dx=(q.x+q.w/2)-(p.x+p.w/2), dy=(q.y+q.h/2)-(p.y+p.h/2), d=Math.hypot(dx,dy);
    if(d>ROPE.REST){ const a=Math.min(ROPE.AMAX, ROPE.K*(d-ROPE.REST)); p.vx+=dx/d*a*dt; p.vy+=dy/d*a*dt; } }
  p.vx=clamp(p.vx,-320,320);
  // 이동 + 충돌
  if(p.onMover!=null){ const m=MV[p.onMover];                       // 이동 발판 위: 함께 이동
    moveX(p, m.dX); if(m.dY<0) moveY(p, m.dY, null); else p.y+=m.dY; }
  if(p.grounded && (p.gTile==='>'||p.gTile==='<')){                  // 컨베이어: 몸 가운데가 벨트 위에 있을 때만 밀어줌
    const fc=tileAt(Math.floor((p.x+p.w/2)/TS), Math.floor((p.y+p.h+1)/TS));   // → 끝에 닿으면 멈춰서 떨어지지 않고 설 수 있음
    if(fc===p.gTile) moveX(p, (fc==='>'?1:-1)*CONVEYOR.SPEED*dt); }
  const carried = p.onPartner && q;
  if(carried) moveX(p, q.vx*dt);
  moveX(p, p.vx*dt);
  p.wasGrounded=p.grounded;                                // 이전 프레임에 서 있었는지 (착지 소리 판단용)
  p.grounded=false; p.onPartner=false; p.onMover=null;
  moveY(p, p.vy*dt, q);
  p.x=clamp(p.x, 0, WORLD_W-p.w);
  // 최대 로프 길이 제한
  if(rope){ const dx=(q.x+q.w/2)-(p.x+p.w/2), dy=(q.y+q.h/2)-(p.y+p.h/2), d=Math.hypot(dx,dy);
    if(d>ROPE.MAX){ const nx=dx/d, ny=dy/d, ex=(d-ROPE.MAX)*(S.mode==='solo'?.5:.7);
      moveX(p,nx*ex); moveY(p,ny*ex,null);
      const out=-(p.vx*nx+p.vy*ny); if(out>0){ p.vx+=nx*out; p.vy+=ny*out; ropeJerk(out); } } }
  // 끼임 해소 (실패하면 마지막 안전 위치로)
  // 살짝 겹침 → 밀어내기 / 깊게 겹침 → 직전 안전 위치로 되돌림
  if(unstick(p, 14)){ p.safeX=p.x; p.safeY=p.y; }
  else { p.x=p.safeX; p.y=p.safeY; p.vx=0; p.vy=0; unstick(p); }
  checkEvents(id);
}

const overlap=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
function checkEvents(id){

  else if(hm>=S.milestone+25 && hm%BAND_M!==0){ S.milestone=Math.floor(hm/25)*25; if(S.milestone%BAND_M) toast(`🎉 ${S.milestone}m 돌파!`, 1400); }
}

const genCode=()=>Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const lobbyStatus=t=>$('#lobbyStatus').textContent=t;
function getSb(){ if(!net.sb && window.supabase) net.sb = window.supabase.createClient(SUPA.URL, SUPA.KEY, { auth:{ persistSession:false, autoRefreshToken:false } }); return net.sb; }
function needNet(){
  if(!window.supabase || !window.RTCPeerConnection){ lobbyStatus('온라인 연결 모듈을 불러오지 못했어요. 인터넷 연결을 확인하세요.'); return false; }
  getSb(); return true;
}
const roster = () => Object.keys((net.ch && net.ch.presenceState()) || {});
function sig(p){ if(net.ch) net.ch.send({type:'broadcast', event:'sig', payload:{...p, from:net.uid, to:p.to||net.peerUid}}); }

function openChannel(code, role){
  net.uid = role+'-'+Math.random().toString(36).slice(2,8);
  const ch = net.ch = net.sb.channel(ROOM_PREFIX+code, { config:{ broadcast:{ self:false }, presence:{ key:net.uid } } });
  ch.on('broadcast', {event:'sig'}, ({payload}) => onSignal(payload));
  ch.on('broadcast', {event:'g'},   ({payload}) => { if(net.relay){ net.lastRecv=now(); onData(payload); } });
  ch.on('presence',  {event:'leave'}, ({key}) => {
    if(key!==net.peerUid) return;
    if(net.linked && net.relay) linkLost();                       // 서버 경유 중 상대가 나감
    else if(!net.linked && S.mode==='host'){                       // 연결 성사 전에 나감 → 다음 사람 받기
      if(net.pc){ net.pc.onconnectionstatechange=null; try{ net.pc.close(); }catch(e){} } net.pc=null; net.dc=null; net.peerUid=''; }
  });
  return ch;
}

function createRoom(){
  if(!needNet()) return;
  net.close(); lobbyStatus('코드 만드는 중…');
  const code=genCode(); S.mode='host'; S.me='P1'; net.code=code;
  const ch=openChannel(code,'P1');
  ch.subscribe(st=>{
    if(st==='SUBSCRIBED') net.later(async ()=>{
      if(roster().some(k=>k.startsWith('P1-') && k!==net.uid)){ net.close(); return createRoom(); }   // 이미 쓰는 코드면 다시 생성
      await ch.track({ role:'P1' });
      $('#waitCode').textContent=code; lobbyStatus('친구를 기다리는 중…');
    }, 600);
    else if(st==='CHANNEL_ERROR' || st==='TIMED_OUT') netError({type:'network'});
  });
}
function joinRoom(code){
  code=(code||'').trim().toUpperCase();
  if(code.length!==4) return lobbyStatus('4자리 코드를 입력하세요.');
  if(!needNet()) return;
  net.close(); lobbyStatus('입장하는 중…'); S.mode='guest'; S.me='P2'; net.code=code;
  const ch=openChannel(code,'P2');
  ch.subscribe(async st=>{
    if(st==='SUBSCRIBED'){
      await ch.track({ role:'P2' });
      net.later(()=>{
        const keys=roster(), host=keys.find(k=>k.startsWith('P1-'));
        if(!host) return netError({type:'peer-unavailable'});
        if(keys.some(k=>k.startsWith('P2-') && k!==net.uid)) return netError({type:'full'});
        net.peerUid=host; sendHello(0);
      }, 1200);
    } else if(st==='CHANNEL_ERROR' || st==='TIMED_OUT') netError({type:'network'});
  });
  net.joinTimer=setTimeout(()=>{ if(!net.linked) netError({type:'timeout'}); }, 20000);
}
function sendHello(n){ if(net.linked || net.pc || !net.ch) return; sig({t:'hello'}); if(n<4) net.later(()=>sendHello(n+1), 1500); }

async function onSignal(p){
  if(p.to && p.to!==net.uid) return;
  try{
    if(p.t==='hello' && S.mode==='host'){
      if(net.peerUid && net.peerUid!==p.from) return sig({t:'full', to:p.from});
      if(net.pc) return;                                      // hello 재전송 무시
      net.peerUid=p.from; await startPeer(true);
    }
    else if(p.t==='offer'  && S.mode==='guest' && !net.pc) await startPeer(false, p.sdp);
    else if(p.t==='answer' && net.pc){ await net.pc.setRemoteDescription(p.sdp); flushIce(); }
    else if(p.t==='ice'    && net.pc){ if(net.pc.remoteDescription) net.pc.addIceCandidate(p.c).catch(()=>{}); else net.pendingIce.push(p.c); }
    else if(p.t==='ice')   net.pendingIce.push(p.c);
    else if(p.t==='full'   && S.mode==='guest') netError({type:'full'});
    else if(p.t==='relay') enableRelay(false);
  }catch(e){ enableRelay(true); }
}
async function startPeer(isHost, offer){
  const pc = net.pc = new RTCPeerConnection({ iceServers:ICE_SERVERS });
  pc.onicecandidate = e => { if(e.candidate) sig({t:'ice', c:e.candidate.toJSON()}); };
  pc.onconnectionstatechange = () => { const s=pc.connectionState;
    if(!net.linked && s==='failed') enableRelay(true);
    else if(net.linked && !net.relay && (s==='failed'||s==='closed')) linkLost(); };
  const setup = dc => {
    net.dc = dc;
    dc.onopen = () => linkOpen('p2p');
    dc.onmessage = e => { net.lastRecv=now(); try{ onData(JSON.parse(e.data)); }catch(_){} };
    dc.onclose = () => { if(net.dc===dc && net.linked && !net.relay) linkLost(); };
  };
  if(isHost){
    setup(pc.createDataChannel('game', { ordered:true }));
    await pc.setLocalDescription(await pc.createOffer());
    sig({t:'offer', sdp:{ type:pc.localDescription.type, sdp:pc.localDescription.sdp }});
  } else {
    pc.ondatachannel = e => setup(e.channel);
    await pc.setRemoteDescription(offer); flushIce();
    await pc.setLocalDescription(await pc.createAnswer());
    sig({t:'answer', sdp:{ type:pc.localDescription.type, sdp:pc.localDescription.sdp }});
  }
  net.later(()=>{ if(!net.linked) enableRelay(true); }, P2P_TIMEOUT);
}
function flushIce(){ const l=net.pendingIce; net.pendingIce=[]; for(const c of l) net.pc.addIceCandidate(c).catch(()=>{}); }
function enableRelay(announce){
  if(net.linked || !net.ch) return;
  if(net.pc){ net.pc.onconnectionstatechange=null; try{ net.pc.close(); }catch(e){} net.pc=null; net.dc=null; }
  net.relay=true; if(announce) sig({t:'relay'});
  linkOpen('relay');
}
function linkOpen(kind){
  if(net.linked) return;
  net.linked=true; clearTimeout(net.joinTimer); net.lastRecv=now();
  if(kind==='p2p'){ net.relay=false; net.later(()=>{ if(net.dc && net.dc.readyState==='open') net.leaveChannel(); }, 2000); }  // 서버 연결 정리
  else toast('🌐 직접 연결이 막혀서 서버 경유로 연결했어요', 2400);
  if(S.mode==='guest'){ net.send({t:'hello', v:GAME_VERSION}); net.bestRtt=1e9; net.syncN=0; net.send({t:'sync',c:now()}); lobbyStatus('연결됨! 준비 중…'); }
  else { lobbyStatus('친구가 들어왔어요! 준비 중…'); }
}
function netTick(){                                   // 연결 확인 신호 + 끊김 감지 (메인 루프에서 호출)
  if(!net.linked) return;
  if(now()-net.lastBeat > (net.relay?HEARTBEAT.relay:HEARTBEAT.p2p)){ net.lastBeat=now(); net.send({t:'hb'}); }
  if(now()-net.lastRecv > HEARTBEAT.timeout) linkLost();
}
addEventListener('pagehide', ()=>{ if(net.linked) net.send({t:'bye'}); });
setInterval(netTick, 500);   // 화면 갱신(rAF)과 별개로 동작
function linkLost(){ if(S.mode!=='solo') showMsg('연결 종료','상대방과의 연결이 끊겼어요.'); }
function netError(e){
  const map={'peer-unavailable':'방이 없거나 이미 게임이 시작됐어요. 코드를 확인하세요.','timeout':'입장하지 못했어요. 코드를 확인하고 다시 시도하세요.',
             'full':'이미 2명이 플레이 중인 방이에요.','network':'네트워크 연결이 불안정해요.'};
  const msg=map[e.type]||'연결 오류가 발생했어요. 다시 시도하세요.';
  if(S.phase!=='idle') showMsg('연결 오류',msg); else lobbyStatus(msg);
  net.close();
}
function onData(m){
  switch(m.t){
    case 'hb':    break;
    case 'bye':   linkLost(); break;
    case 'sync':  net.send({t:'syncR',c:m.c,h:now()}); break;
    case 'syncR': { const rtt=now()-m.c; if(rtt<net.bestRtt){ net.bestRtt=rtt; net.off=m.h+rtt/2-now(); }
                    if(++net.syncN<5) net.send({t:'sync',c:now()}); else net.send({t:'ready'}); break; }
    case 'hello': S.peerVersion=m.v; if(S.mode==='host' && m.v!==GAME_VERSION) versionMismatch(m.v, true); break;   // 참여자 버전 확인
    case 'ready': if(S.mode==='host'){ if(S.peerVersion!==GAME_VERSION) versionMismatch(S.peerVersion, true); else hostIntro(); } break;   // 버전이 같을 때만 설명 화면으로
    case 'vmismatch': versionMismatch(m.v, false); break;
    case 'intro': clearTimeout(net.joinTimer); if(m.v!==GAME_VERSION){ versionMismatch(m.v, true); break; } applyConfig(m.cfg); prepareIntro(m.seed); break;   // 방장 설정 그대로 사용
    case 'go':    S.readyPeer=true; introStatusUpdate(); if(S.mode==='host' && S.readyMe) startRound(); break;
    case 'again': if(S.mode==='host') startRound(); break;
    case 'start': clearTimeout(net.joinTimer); beginRound(m.at-net.off, m.seed); break;
    case 'lava':  if(S.mode==='guest'){ S.lava.y=m.y; S.lava.v=m.v; } break;
    case 'crumble': { const at=S.crumble.get(m.k); if(at==null || m.at<at || gameTime()-at>=CRUMBLE.FALL+CRUMBLE.BACK) S.crumble.set(m.k, m.at); } break;
    case 'over':  if(S.phase==='run'){ S.cause=m.cause; endRound('over'); } break;
    case 's':     if(S.remote && S.phase!=='idle'){ const r=S.remote;
                    if(Math.hypot(m.x-r.x,m.y-r.y)>120){ const ob=S.hb[other(S.me)]; S.disp[other(S.me)]={x:m.x,y:m.y,w:ob.w,h:ob.h}; }   // 리스폰 등 순간이동
                    Object.assign(r,{x:m.x,y:m.y,vx:m.vx,vy:m.vy,grounded:!!m.g,face:m.f,at:now()});
                    if(m.r!==undefined && S.mode==='guest' && !S.ropeBroken) S.strain=m.r; } break;
    case 'jerk':  if(ropeJudge()) addStrain(m.a); break;
    case 'snap':  if(!S.ropeBroken) snapRope(); break;
    case 'coin':  S.coins.add(m.i); sfx(988,.06,'triangle',.03); break;
    case 'fall':  registerFall(m.id, m.m, false); break;
  }
}

// 설명 화면에서 시작하면 그때 보던 맵 그대로, 다시 하기는 새 맵
function startRound(){ const at=now()+GAME.COUNTDOWN, seed = S.phase==='intro' ? S.seed : (Math.random()*2147483647)|0; if(S.mode==='host') net.send({t:'start',at,seed}); beginRound(at,seed); }
function beginRound(at, seed){
  S.seed = seed || 1; buildWorld(S.seed);
  resetRound(); clearInput(); S.startAt=at; S.phase='count';
  hideScreens(); hide('#ovIntro'); hide('#ovResult'); hide('#ovMsg'); show('#game');
  updateMe(); resize();
}
function requestRestart(){ if(S.mode==='guest') net.send({t:'again'}); else startRound(); }
const SCREENS=['#lobby','#select','#room'];
const hideScreens = () => SCREENS.forEach(hide);
function showScreen(id){ hideScreens(); hide('#game'); ['#ovIntro','#ovResult','#ovMsg'].forEach(hide); show(id); }
function goLobby(){ net.close(); S.phase='idle'; S.mode='solo'; clearInput(); applyConfig(DB.cfg); $('#toast').classList.add('hide'); showScreen('#lobby'); lobbyStatus(''); }
// ④ 설명 화면: 맵은 미리 만들어 뒤에 보여주고(딤드), 시작하기를 누르면 3초 카운트다운
function prepareIntro(seed){
  S.seed=seed; buildWorld(seed); resetRound(); clearInput();
  S.startAt=now()+1e9; S.phase='intro'; S.readyMe=false; S.readyPeer=false;
  hideScreens(); hide('#ovResult'); hide('#ovMsg'); show('#game'); show('#ovIntro');
  const touchUI=document.body.classList.contains('touch'), mine = S.mode==='solo' ? ['P1','P2'] : [S.me];
  $('#introKeys').innerHTML = ['P1','P2'].map(id=>{
    const cfg=PLAYERS[id], k=cfg.keys, key=x=>({KeyA:'A',KeyD:'D',KeyW:'W',ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑'}[x]||x);
    const how = !mine.includes(id) ? '친구' : touchUI ? '◀ ▶ 이동 · 점프 버튼 (길게 = 높이)' : `${key(k.left)} ${key(k.right)} 이동 · ${key(k.jump)} 점프 (길게 = 높이)`;
    const me = S.mode!=='solo' && id===S.me ? ' (나)' : '';
    return `<div class="row" style="--c:${cfg.color}"><span class="chip">${cfg.name}${me}</span><span>${how}</span></div>`; }).join('');
  $('#btnStart').disabled=false; introStatusUpdate(); updateMe(); resize();
}
function introStatusUpdate(){ const el=$('#introStatus'); if(!el) return;
  if(S.mode==='solo') el.textContent='';
  else if(S.readyMe) el.textContent = S.readyPeer ? '곧 시작해요!' : '친구가 시작하기를 누르면 출발해요…';
  else el.textContent = S.readyPeer ? '친구는 준비 완료! 시작하기를 눌러주세요' : ''; }
function pressStart(){
  if(S.phase!=='intro') return;
  if(S.mode==='solo') return startRound();
  S.readyMe=true; $('#btnStart').disabled=true; net.send({t:'go'}); introStatusUpdate();
  if(S.mode==='host' && S.readyPeer) startRound();
}
function showMsg(title,text,reload=false){ S.phase='idle'; $('#msgTitle').textContent=title; $('#msgText').textContent=text;
  $('#btnMsgReload').hidden=!reload; $('#btnMsgOk').className = reload ? 'btn ghost' : 'btn primary'; show('#ovMsg'); net.close(); }
// 버전이 다를 때: 상대에게도 알리고(가능하면) 둘 다 새로고침 안내
function versionMismatch(other, tellPeer){
  if(tellPeer) net.send({t:'vmismatch', v:GAME_VERSION});
  const o = other ? other : '예전 버전';
  setTimeout(()=>showMsg('버전이 달라요', `내 버전 ${GAME_VERSION} · 친구 버전 ${o}\n두 사람 모두 새로고침해서 최신 버전으로 다시 시작해 주세요.`, true), tellPeer?150:0);
}
// 새로고침: 주소 뒤에 시각을 붙여 캐시를 피하고 최신 파일을 받아옴
$('#btnMsgReload').onclick=()=>{ const u=new URL(location.href); u.searchParams.delete('room'); u.searchParams.set('v', Date.now()); location.replace(u.toString()); };
// 기록 출력: console.info/warn이 없는 환경(일부 미리보기·인앱 브라우저)에서도 멈추지 않게 안전하게 호출
function logInfo(...a){ try{ (console.info||console.log).apply(console,a); }catch(_){} }
function logWarn(...a){ try{ (console.warn||console.log).apply(console,a); }catch(_){} }

function updateMe(){
  const el=$('#hudMe'), solo=S.mode==='solo', touchUI=document.body.classList.contains('touch');
  el.textContent = solo ? (touchUI ? PLAYERS[S.me].name : '테스트') : `나 ${PLAYERS[S.me].name}`;
  el.style.background = (!solo || touchUI) ? PLAYERS[S.me].color : '';
  $('#btnJump').style.setProperty('--c', PLAYERS[S.me].color);
  $('#btnSwap').hidden = !(solo && touchUI);
}

const BEST_KEY='duorope-best-score-v1';
const loadBest = () => { try{ return JSON.parse(localStorage.getItem(BEST_KEY)) || {score:0,m:0}; }catch(e){ return {score:0,m:0}; } };

function showResult(){
  const sc=calcScore(), prev=loadBest(), isNew=sc.total>prev.score; if(isNew) saveBest({score:sc.total, m:S.best});
  $('#resTitle').textContent = '퇴근!';
  $('#resScore').textContent = num(sc.total);
  $('#resBestTag').textContent = isNew ? '최고 점수 갱신!' : `최고 점수 ${num(prev.score)}점`;
  $('#resBreak').innerHTML = sc.parts.map(p=>`<span>${p.label}</span><span class="v">${p.val}</span><span class="p${p.pts<0?' minus':''}">${p.pts>0?'+':''}${num(p.pts)}</span>`).join('')
    + `<div class="sum"><span>합계</span><b>${num(sc.total)}점</b></div>`;
  S.lastScore=sc; clearTimeout(toastT); $('#toast').classList.add('hide');
  show('#ovResult'); showBestInLobby();
  if(isNew){ sfx(523,.12,'triangle'); setTimeout(()=>sfx(659,.12,'triangle'),120); setTimeout(()=>sfx(784,.25,'triangle'),240); }
}
async function shareOrCopy(text,url,copiedMsg='📋 복사했어요! 친구에게 붙여넣기 하세요'){
  try{ if(navigator.share){ await navigator.share({title:'듀오 로프',text,url}); return; } }catch(e){ if(e.name==='AbortError') return; }
  const full=url?text+'\n'+url:text;
  try{ await navigator.clipboard.writeText(full); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
  toast(copiedMsg);
}

const cvW=$('#layer-world'), cvI=$('#layer-images'), wc=cvW.getContext('2d'), ic=cvI.getContext('2d');
const VIEW_H = { MIN:420, MAX:820 };   // 세로로 보이는 범위(px) — 작으면 캐릭터가 크게, 크면 위가 더 많이 보임
let VH=VIEW_H.MIN, VW=640, camX=0, camY=WORLD_H-VH;
function resize(){
  const st=$('#stage'), w=Math.max(100,st.clientWidth-12), h=Math.max(100,st.clientHeight-8);
  VW=WORLD_W;                                             // 가로는 맵 전체 고정 (좌우 스크롤 없음)
  VH=clamp(Math.round(VW*h/w), VIEW_H.MIN, VIEW_H.MAX);   // 세로로 보이는 범위만 화면 비율에 맞춤 (넓은 화면은 양옆 여백)
  camX=0; camY=clamp(camY,0,Math.max(0,WORLD_H-VH));
  const sc=Math.min(w/VW,h/VH), W=Math.floor(VW*sc), H=Math.floor(VH*sc), dpr=Math.min(window.devicePixelRatio||1,2.5);
  $('#board').style.width=W+'px'; $('#board').style.height=H+'px';
  for(const [cv,cx] of [[cvW,wc],[cvI,ic]]){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(dpr*sc,0,0,dpr*sc,0,0); }
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));
if(window.ResizeObserver) new ResizeObserver(()=>{ if(!$('#game').hidden) resize(); }).observe($('#stage'));

function drawImg(c,key,x,y,w,h,flip,variant){
  const im=IMAGES[key], src = (variant==='jump' && imgReady(im._jump)) ? im._jump : im._img;
  if(imgReady(src)){                                   // 비율 유지, 박스 아래-가운데 기준
    const sc=Math.min(w/src.naturalWidth, h/src.naturalHeight), dw=src.naturalWidth*sc, dh=src.naturalHeight*sc;
    const dx=x+(w-dw)/2, dy=y+h-dh;
    c.save(); if(flip){ c.translate(dx+dw,dy); c.scale(-1,1); c.drawImage(src,0,0,dw,dh); } else c.drawImage(src,dx,dy,dw,dh); c.restore(); return;
  }
  c.save(); c.globalAlpha=.55; c.fillStyle=im.tint; rr(c,x,y,w,h,Math.min(w,h)*.18); c.fill();
  c.globalAlpha=.95; c.strokeStyle='#fff'; c.lineWidth=1.2; c.setLineDash([3,2]); c.stroke(); c.setLineDash([]);
  c.globalAlpha=1; c.fillStyle='#fff'; c.font=`${Math.max(8,Math.round(Math.min(w,h)*.34))}px sans-serif`;
  c.textAlign='center'; c.textBaseline='middle'; c.fillText(key.replace('IMG-','#'),x+w/2,y+h/2); c.restore();
}
function drawChar(c,key,cx,feetY,flip,jump){        // 몸통 기준 크기·위치로 캐릭터 그리기 → 그림 윗변 y 반환
  const im=IMAGES[key], useJ = jump && imgReady(im._jump), src = useJ ? im._jump : im._img;
  const body = (useJ ? im.jumpBody : im.body) || src.naturalWidth*0.8, bcx = (useJ ? im.jumpCX : im.bodyCX) ?? 0.5;
  const sc=CHAR_BODY/body, dw=src.naturalWidth*sc, dh=src.naturalHeight*sc;
  const dx = cx - dw*(flip ? 1-bcx : bcx), dy = feetY - dh;
  c.save(); if(flip){ c.translate(dx+dw,dy); c.scale(-1,1); c.drawImage(src,0,0,dw,dh); } else c.drawImage(src,dx,dy,dw,dh); c.restore();
  return dy;
}
const flipFor = (key, face, jump) => { const im=IMAGES[key], left = (jump && im.jumpFaceLeft!==undefined) ? im.jumpFaceLeft : im.faceLeft;
  return left ? face>0 : face<0; };   // 바라보는 방향에 맞춰 반전 (점프 그림은 따로)

const hexMix=(a,b,t)=>'#'+[0,2,4].map(i=>Math.round(parseInt(a.substr(i+1,2),16)*(1-t)+parseInt(b.substr(i+1,2),16)*t).toString(16).padStart(2,'0')).join('');
function toneSkin(hm){
  const t=Math.max(0,Math.min(1,(hm-NIGHT_FROM)/(NIGHT_TO-NIGHT_FROM)));
  for(const k in SKIN_DAY){ const a=SKIN_DAY[k], b=SKIN_NIGHT[k]; SKIN[k] = Array.isArray(a) ? a.map((x,i)=>hexMix(x,b[i],t)) : hexMix(a,b,t); }
  SKIN.night=t;
}

function drawBgDecor(c){
  const base=FLOOR_Y-(camY+VH/2), T=now()/1000, hm=Math.max(0,base/TS);
  const list=[...BG_DECOR]; const k0=Math.max(0,Math.floor((hm-400)/200)-1);
  for(let k=k0;k<k0+3;k++) for(const r of BG_REPEAT) list.push({ m:400+k*BG_REPEAT_EVERY+r.dm, x:r.x, key:r.key, w:r.w, h:r.h });
  for(const d of list){
    const sy=VH/2-((d.m*TS)-base)*0.5 + Math.sin(T*1.2+d.m)*4, sx=d.x*VW;
    if(sy<-d.h || sy>VH+d.h) continue;
    const x=sx-d.w/2, y=sy-d.h/2, im=IMAGES[d.key];
    if(imgReady(im._img)){ const sc=Math.min(d.w/im._img.naturalWidth,d.h/im._img.naturalHeight); c.drawImage(im._img,sx-im._img.naturalWidth*sc/2,sy-im._img.naturalHeight*sc/2,im._img.naturalWidth*sc,im._img.naturalHeight*sc); continue; }
    c.save(); c.globalAlpha=.42; rr(c,x,y,d.w,d.h,10); c.fillStyle=im.tint; c.fill();
    c.lineWidth=SKIN.LW; c.strokeStyle=SKIN.LINE; c.stroke(); c.globalAlpha=.75; c.setLineDash([4,3]); c.strokeStyle='#fff'; rr(c,x+3,y+3,d.w-6,d.h-6,7); c.stroke(); c.setLineDash([]);
    c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle'; c.font='bold 10px BaekmukGulimChe, sans-serif';
    c.fillText(im.name.replace(' (임시)',''), sx, sy-6); c.fillText(d.key.replace('IMG-','#'), sx, sy+8); c.restore();
